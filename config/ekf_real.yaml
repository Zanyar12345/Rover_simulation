### ekf.yaml ###


ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Tekerlek Odometrisi (İPTAL EDİLDİ) -> ZED 2 Görsel Odometrisi (Visual Odom) Aktif!
    odom0: /zed/zed_node/odom
    odom0_config: [true,  true,  false,
                   false, false, true,       # Sadece X, Y ve Yaw (Makat Konum) aktif. Twist kapalı! Cılgınca dönmeyi engeller.
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true

    # Tekerlek Odometrisi (Wheel Odom) Eklendi
    odom1: /odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,      # vx, vy (Tünel gibi kör noktalarda hayatta kalmak için açıldı)
                   false, false, true,       # vyaw (Dönüş hızı)
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true

    # IMU iptal: VIO icinde IMU kullaniyor, acisal hizda TF dongusu (spin) uretmemesi icin.
    # imu0: /zed/zed_node/imu/data

ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Tekerlek Odometrisi (İPTAL EDİLDİ) -> ZED 2 Görsel Odometrisi (Visual Odom) Aktif!
    odom0: /zed/zed_node/odom
    odom0_config: [true,  true,  false,
                   false, false, true,       # Sadece X, Y ve Yaw (Makat Konum) aktif. Twist kapalı!
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true

    # Tekerlek Odometrisi (Wheel Odom) Eklendi
    odom2: /odom
    odom2_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,      # vx, vy (Tekerlek Hızları)
                   false, false, true,       # vyaw (Dönüş hızı)
                   false, false, false]
    odom2_queue_size: 10
    odom2_nodelay: true

    # IMU iptal: acisal hizda dongu (spin) uretmemesi icin
    # imu0: /zed/zed_node/imu/data

    # The odometry output from navsat_transform_node
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true

navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
